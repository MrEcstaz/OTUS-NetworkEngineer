      <rect x="190" y="110" width="80" height="80" rx="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="230" y="156" text-anchor="middle" font-weight="bold">R23</text>
      <text x="230" y="215" text-anchor="middle" font-size="13" fill="#555">area 2222</text>
    </g>
    <g>
      <rect x="590" y="110" width="80" height="80" rx="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="630" y="156" text-anchor="middle" font-weight="bold">R25</text>
      <text x="630" y="104" text-anchor="middle" font-size="13" fill="#555">area 2222</text>
    </g>
    <g>
      <rect x="590" y="350" width="80" height="80" rx="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="630" y="396" text-anchor="middle" font-weight="bold">R26</text>
      <text x="630" y="455" text-anchor="middle" font-size="13" fill="#555">area 26</text>
    </g>
    <g>
      <rect x="190" y="350" width="80" height="80" rx="40" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
      <text x="230" y="396" text-anchor="middle" font-weight="bold">R24</text>
      <text x="230" y="455" text-anchor="middle" font-size="13" fill="#555">area 24</text>
    </g>
  </g>

  <!-- link addresses -->
  <g font-size="12.5" fill="#2d3748">
    <text x="430" y="138" text-anchor="middle">10.0.2.0/30</text>
    <text x="430" y="172" text-anchor="middle">2001:db8:2::/64</text>

    <text x="636" y="262" text-anchor="start">10.0.2.8/30</text>
    <text x="636" y="278" text-anchor="start">2001:db8:2:2::/64</text>

    <text x="430" y="378" text-anchor="middle">10.0.2.12/30</text>
    <text x="430" y="412" text-anchor="middle">2001:db8:2:3::/64</text>

    <text x="224" y="262" text-anchor="end">10.0.2.4/30</text>
    <text x="224" y="278" text-anchor="end">2001:db8:2:1::/64</text>
