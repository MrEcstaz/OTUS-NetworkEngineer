  <!-- external stub labels -->
  <g font-size="12.5" fill="#718096">
    <text x="82" y="72" text-anchor="start">к R22 (e0/0)</text>
    <text x="82" y="478" text-anchor="start">к R21 (e0/0)</text>
    <text x="212" y="518" text-anchor="start">к R18 (e0/3)</text>
    <text x="778" y="72" text-anchor="end">к R27 (e0/1)</text>
