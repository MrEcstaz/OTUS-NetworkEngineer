    <line x1="190" y1="410" x2="90" y2="460"/>
    <line x1="270" y1="430" x2="240" y2="500"/>
    <line x1="670" y1="130" x2="770" y2="80"/>
    <line x1="670" y1="160" x2="790" y2="140"/>
    <line x1="670" y1="380" x2="770" y2="430"/>
    <line x1="630" y1="430" x2="630" y2="500"/>
