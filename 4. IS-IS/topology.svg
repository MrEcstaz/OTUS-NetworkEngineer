<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="540" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" fill="#222">ISP Триада: IS-IS R23-R26 (кольцо)</text>

  <!-- links of the ring -->
  <g stroke="#2b6cb0" stroke-width="3">
    <line x1="270" y1="150" x2="590" y2="150"/>
    <line x1="630" y1="190" x2="630" y2="350"/>
    <line x1="590" y1="390" x2="270" y2="390"/>
    <line x1="230" y1="350" x2="230" y2="190"/>
  </g>

  <!-- external stubs -->
  <g stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4">
